# Hyprland configuration : Scrolling Layout ----------------

scrolling {
	fullscreen_on_one_column = true
	column_width             = 0.5
	focus_fit_method         = 0
	follow_focus             = true
	follow_min_visible       = 0.4
	explicit_column_widths   = 0.333, 0.5, 0.667, 1.0
	direction                = right
}

